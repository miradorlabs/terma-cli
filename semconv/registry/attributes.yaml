file_format: definition/2
attributes:
  # The envelope.
  - key: mirador.project.id
    type: string
    stability: development
    brief: The Mirador project the record is delivered to, the platform's routing key.
    note: A resource attribute, on hook events and on every part the relay forwards.
  - key: terma.schema.version
    type: string
    stability: development
    brief: The version of this registry the record follows.
    note: A resource attribute; "2" for this registry.
    examples: ["2"]

  # Agents and sessions.
  - key: terma.main_agent.version
    type: string
    stability: development
    brief: The version of the agent named by gen_ai.main_agent.name.
    note: Sent by hooks-only agents. Claude Code and Codex carry their version in their own telemetry's service.version.
  - key: terma.agent.id
    type: string
    stability: development
    brief: The id of a subagent run, scoped to its session.
    note: Transient, so not gen_ai.agent.id; a subagent whose telemetry uses it as its session id is claimed under it too.
  - key: terma.agent.parent.id
    type: string
    stability: development
    brief: The terma.agent.id, or the thread, that launched the subagent.
  - key: terma.agent.path
    type: string
    stability: development
    brief: The agent's label for a subagent's place in its tree.
    examples: ["/root/<task>"]
  - key: terma.agent.nickname
    type: string
    stability: development
    brief: The name the agent gave a subagent.
  - key: terma.session.parent.id
    type: string
    stability: development
    brief: The session that opened this one for a subagent.
  - key: terma.session.title
    type: string
    stability: development
    brief: The name the agent gave the session.
    note: Content; sent only while the team's policy collects prompts.
    annotations:
      content: prompts
  - key: terma.turn.id
    type: string
    stability: development
    brief: The turn the event belongs to, in the agent's own id.
  - key: terma.model_call.id
    type: string
    stability: development
    brief: The model call the event is about, in the agent's own id.
    note: Claude Code's is the API request id its telemetry reports as request_id.
    examples: ["req_011CgSuPsrmoVLyK2MFya1S9"]
  - key: terma.response.service_tier
    type: string
    stability: development
    brief: The service tier the provider says served the call, in its own spelling.
    examples: ["standard", "priority"]
  - key: terma.response.inference_geo
    type: string
    stability: development
    brief: Where the provider says it ran the call, in its own spelling.
    examples: ["global", "us"]

  # Operations.
  - key: terma.operation.status
    type: string
    stability: development
    brief: How the operation the event records ended.
    note: Each event documents its own vocabulary on its reference to this attribute.
  - key: terma.operation.duration_ms
    type: int
    stability: development
    brief: How long the operation took, in milliseconds.
  - key: terma.operation.duration_status
    type:
      members:
        - id: invalid
          value: invalid
          brief: The agent reported a duration that is not a non-negative integer.
          stability: development
    stability: development
    brief: Why terma.operation.duration_ms is absent when the agent sent one.
  - key: terma.operation.interrupted
    type: boolean
    stability: development
    brief: Whether the failed operation was interrupted by the developer.
  - key: terma.approval.reason
    type: string
    stability: development
    brief: The agent's description of what an approval request asks to do.
    note: Tool content; withheld unless the team's policy collects it.
    annotations:
      content: tool
  - key: terma.approval.permission_mode
    type: string
    stability: development
    brief: The agent's permission mode when it asked for approval.
  - key: terma.capture.surface
    type:
      members:
        - id: desktop
          value: desktop
          brief: Records only terma reports for the agent, sent from every surface.
          stability: development
    stability: development
    brief: The capture path the record came from.
  - key: terma.capture.gap
    type:
      members:
        - id: invalid_checkpoint
          value: invalid_checkpoint
          brief: The ordering checkpoint was unreadable, so a new stream began.
          stability: development
    stability: development
    brief: Why an observation stream lost its ordering boundary.
  - key: terma.hook.event
    type: string
    stability: development
    brief: The agent hook that produced the record.
    examples: ["PermissionRequest", "afterAgentResponse"]

  # Observations and evidence.
  - key: terma.observation.id
    type: string
    stability: development
    brief: The replay-stable id of one observation.
  - key: terma.observation.sequence
    type: int
    stability: development
    brief: The observation's position in its stream.
  - key: terma.observation.stream
    type: string
    stability: development
    brief: The ordered stream the observation belongs to; a new stream marks a lost ordering boundary.
  - key: terma.observation.time
    type: string
    stability: development
    brief: When the provider wrote what was observed, RFC 3339 in UTC.
  - key: terma.evidence.source
    type: string
    stability: development
    brief: Where the evidence the record carries was read, named by the agent's package.
    note: >
      Each agent has its own: claude_account, claude_statusline, claude_stop_failure,
      claude_transcript, codex_rollout, codex_hook, codex_session_index, copilot_workspace,
      cursor_hook and antigravity_hook.
    examples: ["codex_rollout", "cursor_hook"]
  - key: terma.evidence.status
    type: string
    stability: development
    brief: Whether the evidence could be read, so missing data never reads as zero.
    note: >
      present, unavailable, missing, unreadable, unsupported, oversized or malformed; a
      capture's progress adds backlog, incomplete, not_ready, gap, search_limit,
      session_mismatch, unsupported_path, invalid_session and lock_timeout.

  # Files and compaction.
  - key: terma.files.paths
    type: string[]
    stability: development
    brief: Repository-relative paths the session wrote.
  - key: terma.compaction.item.id
    type: string
    stability: development
    brief: The agent's id for the compaction item.
  - key: terma.compaction.trigger
    type:
      members:
        - id: auto
          value: auto
          brief: The agent compacted on its own.
          stability: development
        - id: manual
          value: manual
          brief: The developer asked for it.
          stability: development
    stability: development
    brief: What started a compaction.

  # Messages.
  - key: terma.message.id
    type: string
    stability: development
    brief: The agent's id for the message.
  - key: terma.message.text
    type: string
    stability: development
    brief: What the message said.
    note: Content; sent only while the team's policy collects prompts.
    annotations:
      content: prompts
  - key: terma.message.phase
    type: string
    stability: development
    brief: The agent's label for where in the turn the message was said.
  - key: terma.message.truncated
    type: boolean
    stability: development
    brief: Whether terma.message.text was cut at terma's bound.
  - key: terma.message.count
    type: int
    stability: development
    brief: How many messages the run exchanged.

  # Usage, as an agent without an export reports it.
  - key: terma.usage.status
    type:
      members:
        - id: available
          value: available
          brief: Every count was reported.
          stability: development
        - id: partial
          value: partial
          brief: Some counts were reported.
          stability: development
        - id: unavailable
          value: unavailable
          brief: No count was reported.
          stability: development
        - id: invalid
          value: invalid
          brief: A count was not a non-negative integer.
          stability: development
    stability: development
    brief: Whether the record's usage counts were reported.
  - key: terma.usage.semantics
    type:
      members:
        - id: snapshot
          value: snapshot
          brief: A repeated snapshot, never an additive delta.
          stability: development
    stability: development
    brief: How the record's usage counts add up.
  - key: terma.usage.scope
    type:
      members:
        - id: parent_turn
          value: parent_turn
          brief: The parent conversation's turn, subagents excluded.
          stability: development
    stability: development
    brief: What the record's usage counts cover.
  - key: terma.usage.input_tokens
    type: int
    stability: development
    brief: Input tokens as the agent reported them.
    note: Not gen_ai.usage.input_tokens; the agent does not say whether cached tokens are included.
  - key: terma.usage.output_tokens
    type: int
    stability: development
    brief: Output tokens as the agent reported them, in a snapshot rather than per call.
  - key: terma.usage.cache_read_tokens
    type: int
    stability: development
    brief: Cache-read input tokens as the agent reported them, in a snapshot rather than per call.
  - key: terma.usage.cache_write_tokens
    type: int
    stability: development
    brief: Cache-write input tokens as the agent reported them, in a snapshot rather than per call.
  - key: terma.context.tokens
    type: int
    stability: development
    brief: The tokens the context held.
  - key: terma.context.window_size
    type: int
    stability: development
    brief: The context window's size, in tokens.
  - key: terma.context.used_percent
    type: double
    stability: development
    brief: How full the context was, from 0 to 100.
  - key: terma.model_param.thinking
    type: string
    stability: development
    brief: The thinking setting the developer selected for the model.
  - key: terma.model_param.context
    type: string
    stability: development
    brief: The context setting the developer selected for the model.
  - key: terma.loop.count
    type: int
    stability: development
    brief: How many agent loops the run took.
  - key: terma.tool_call.count
    type: int
    stability: development
    brief: How many tool calls the run made.
  - key: terma.step.index
    type: int
    stability: development
    brief: The step's index in its conversation, which only grows.
  - key: terma.invocation.number
    type: int
    stability: development
    brief: The agent's invocation counter.
  - key: terma.invocation.initial_steps
    type: int
    stability: development
    brief: How many steps the conversation held when the invocation began.
  - key: terma.execution.number
    type: int
    stability: development
    brief: The agent's execution counter.
  - key: terma.termination.reason
    type: string
    stability: development
    brief: The agent's word for why the turn ended.
  - key: terma.agent.fully_idle
    type: boolean
    stability: development
    brief: Whether the agent had nothing left running when the turn ended.
  - key: terma.provider.session.id
    type: string
    stability: development
    brief: The agent's own session id, where it differs from the session.id terma files the record under.
  - key: terma.funding.status
    type: string
    stability: development
    brief: Whether the record carries who paid for the session.
    examples: ["unavailable"]
  - key: terma.quota.status
    type: string
    stability: development
    brief: Whether the record carries the session's quota.
    examples: ["unavailable"]

  # Funding, quota and account.
  - key: terma.account.id
    type: string
    stability: development
    brief: The provider's id for the account the session ran under.
  - key: terma.account.seat.id
    type: string
    stability: development
    brief: An opaque id for one person's seat in a shared account.
    note: >
      The hex SHA-256 of the account scope, a NUL byte and user.email; it stands in for an
      email the team's policy withholds.
  - key: terma.account.status
    type: string
    stability: development
    brief: Whether the record names the account.
    examples: ["available", "unavailable"]
  - key: terma.account.organization.id
    type: string
    stability: development
    brief: The provider's id for the account's organization.
  - key: terma.account.organization.type
    type: string
    stability: development
    brief: The provider's word for the organization's kind.
  - key: terma.account.plan_type
    type: string
    stability: development
    brief: The provider's word for the account's plan.
  - key: terma.account.seat_tier
    type: string
    stability: development
    brief: The provider's word for the seat's tier.
  - key: terma.account.rate_limit_tier
    type: string
    stability: development
    brief: The provider's word for the usage limits the account's user runs under.
    note: >
      Claude's userRateLimitTier. It sets how much a percent of each window buys: a Team seat can run
      on Max 5x limits, and Max 5x and Max 20x both report the plan "max".
    examples: ["default_claude_max_5x", "default_claude_max_20x"]
  - key: terma.account.organization.rate_limit_tier
    type: string
    stability: development
    brief: The provider's word for the usage limits of the account's organization.
    note: >
      Claude's organizationRateLimitTier. It names the organization's tier, which a seat's own
      terma.account.rate_limit_tier can differ from.
    examples: ["default_raven"]
  - key: terma.account.billing_type
    type: string
    stability: development
    brief: The provider's word for how the account is billed.
  - key: terma.account.extra_usage.enabled
    type: boolean
    stability: development
    brief: Whether the account may spend past its plan.
  - key: terma.rate_limit.five_hour.used_percent
    type: double
    stability: development
    brief: How much of the five-hour window is used, from 0 to 100.
  - key: terma.rate_limit.five_hour.resets_at
    type: int
    stability: development
    brief: When the five-hour window resets, in Unix seconds.
  - key: terma.rate_limit.seven_day.used_percent
    type: double
    stability: development
    brief: How much of the seven-day window is used, from 0 to 100.
  - key: terma.rate_limit.seven_day.resets_at
    type: int
    stability: development
    brief: When the seven-day window resets, in Unix seconds.
  - key: terma.rate_limit.spend_limit.used_percent
    type: double
    stability: development
    brief: How much of the spend limit is used, from 0 to 100.
  - key: terma.rate_limit.spend_limit.resets_at
    type: int
    stability: development
    brief: When the spend limit resets, in Unix seconds.
  - key: terma.rate_limit.primary.used_percent
    type: double
    stability: development
    brief: How much of the provider's primary window is used, from 0 to 100.
  - key: terma.rate_limit.primary.window_minutes
    type: int
    stability: development
    brief: The primary window's length, in minutes.
  - key: terma.rate_limit.primary.resets_at
    type: int
    stability: development
    brief: When the primary window resets, in Unix seconds.
  - key: terma.rate_limit.secondary.used_percent
    type: double
    stability: development
    brief: How much of the provider's secondary window is used, from 0 to 100.
  - key: terma.rate_limit.secondary.window_minutes
    type: int
    stability: development
    brief: The secondary window's length, in minutes.
  - key: terma.rate_limit.secondary.resets_at
    type: int
    stability: development
    brief: When the secondary window resets, in Unix seconds.
  - key: terma.rate_limit.reached_type
    type: string
    stability: development
    brief: The provider's word for the limit the account reached.
  - key: terma.spend_control.reached
    type: boolean
    stability: development
    brief: Whether the account reached its spend control.
  - key: terma.credits.present
    type: boolean
    stability: development
    brief: Whether the account has credits.
  - key: terma.credits.unlimited
    type: boolean
    stability: development
    brief: Whether the account's credits are unlimited.
  - key: terma.credits.balance
    type: string
    stability: development
    brief: The account's credit balance, a decimal in the provider's own unit.
    note: Kept as text to preserve its precision; it is not USD.

  # Commits.
  - key: terma.commit.lines.added
    type: int
    stability: development
    brief: Lines the commit added across its text files.
  - key: terma.commit.lines.deleted
    type: int
    stability: development
    brief: Lines the commit deleted across its text files.
  - key: terma.commit.file.count
    type: int
    stability: development
    brief: How many files the commit changed.
  - key: terma.commit.file.stats
    type: any
    stability: development
    brief: The commit's changes per file, at most 50 of them.
    note: >
      An array of maps of path, lines_added, lines_deleted, and session_id and agent, the
      stamped session whose manifest names the file. A binary file has no line counts; a
      file no session touched has no session_id or agent.
  - key: terma.commit.file.stats_reported
    type: int
    stability: development
    brief: How many files terma.commit.file.stats lists.
  - key: terma.commit.file.stats_truncated
    type: boolean
    stability: development
    brief: Whether terma.commit.file.stats left files out.
  - key: terma.commit.session.ids
    type: string[]
    stability: development
    brief: The sessions stamped into the commit.
    note: Each id once, though two agents may share it; terma.commit.sessions names each session.
  - key: terma.commit.sessions
    type: any
    stability: development
    brief: The sessions stamped into the commit, each with its agent.
    note: >
      An array of maps of session_id, agent and agent_version, in stamping order, one per
      agent and session id: harnesses choose their own ids, so an id names a session only
      with its agent. agent is the Agent-Tool trailer's agent, such as claude-code or codex,
      and agent_version its version, which is no part of the session's identity. A session
      stamped with no Agent-Tool has no agent and no agent_version.
  - key: terma.commit.session.count
    type: int
    stability: development
    brief: How many sessions are stamped into the commit.
    note: The length of terma.commit.sessions.
  - key: terma.commit.staged.count
    type: int
    stability: development
    brief: How many files were staged when the message was stamped.
  - key: terma.commit.message_source
    type:
      members:
        - id: message
          value: message
          brief: The message came from -m or -F.
          stability: development
        - id: template
          value: template
          brief: The message came from a template.
          stability: development
        - id: commit
          value: commit
          brief: The message came from an existing commit (-c, -C or --amend).
          stability: development
    stability: development
    brief: Where git took the commit message from, as prepare-commit-msg reports it.

  # Pushes.
  - key: terma.push.id
    type: string
    stability: development
    brief: One pushed ref of one push, so a record sent twice can be counted once.
  - key: terma.push.remote.name
    type: string
    stability: development
    brief: The configured remote the push went to.
    note: Omitted when the push named a URL instead of a remote.
    examples: ["origin"]
  - key: terma.push.remote.url
    type: string
    stability: development
    brief: The URL the push went to, without credentials.
    note: Omitted for a local path. It need not be origin, which vcs.repository.url.full names.
  - key: terma.push.remote.ref
    type: string
    stability: development
    brief: The full name of the branch the push updated on the remote.
    examples: ["refs/heads/feature/parser"]
  - key: terma.push.local.ref
    type: string
    stability: development
    brief: What was pushed, as git names it to pre-push.
    note: A full ref name, HEAD, or a commit id when the push named one.
    examples: ["refs/heads/feature/parser", "HEAD"]
  - key: terma.push.old.revision
    type: string
    stability: development
    brief: The remote branch's commit id before the push; omitted for a new branch.
  - key: terma.push.new.revision
    type: string
    stability: development
    brief: The commit id the push set the remote branch to.
  - key: terma.push.forced
    type: boolean
    stability: development
    brief: Whether the push replaced commits the remote branch had, as a force-push does.
    note: Omitted for a new branch and when the old commit is not in the local repository.
  - key: terma.push.range
    type:
      members:
        - id: update
          value: update
          brief: The commits in the new revision and not the old one, exactly.
          stability: development
        - id: new_branch
          value: new_branch
          brief: >
            A new branch: the commits in the new revision that no branch of the remote
            had, as the local remote-tracking branches showed before the push.
          stability: development
        - id: fallback
          value: fallback
          brief: >
            The commits in the new revision that no remote-tracking branch had before the
            push, of any remote for a push to a URL: the old commit is not in the local
            repository, or there is no remote to go by, so they may include commits the
            remote already had.
          stability: development
    stability: development
    brief: How terma.push.commits was worked out.
  - key: terma.push.commits
    type: string[]
    stability: development
    brief: The full ids of the commits the push sent, newest first, at most 500 of them.
  - key: terma.push.commit.count
    type: int
    stability: development
    brief: How many commits the push sent; exact below 10000, at least 10000 otherwise.
  - key: terma.push.commits_truncated
    type: boolean
    stability: development
    brief: Whether terma.push.commits left commits out.
  - key: terma.push.session.ids
    type: string[]
    stability: development
    brief: The sessions stamped into the commits terma.push.commits lists.
    note: Each id once, though two agents may share it; terma.push.sessions names each session.
  - key: terma.push.sessions
    type: any
    stability: development
    brief: The sessions stamped into the commits terma.push.commits lists, each with its agent.
    note: >
      Maps as terma.commit.sessions has them, at most 100, each agent and session id once
      however many commits carry it.
  - key: terma.push.status
    type:
      members:
        - id: tracking_ref_updated
          value: tracking_ref_updated
          brief: >
            Once git push exited, the remote-tracking branch had moved to the new revision,
            which git does only for a ref the remote accepted.
          stability: development
        - id: unknown
          value: unknown
          brief: >
            No evidence either way: the push was rejected, was a dry run, outlasted the
            wait, or has no remote-tracking branch terma can read.
          stability: development
    stability: development
    brief: What the local repository showed about the push's outcome.
    note: >
      Evidence, not proof: another local process updating the same remote-tracking branch
      to the same commit while the push ran would read as tracking_ref_updated. unknown
      never means rejected.

  # The checkout.
  - key: terma.checkout.id
    type: string
    stability: development
    brief: The checkout a confirmed edit landed in, as a hash of its working tree's path.
    note: >
      The first 32 lowercase hex characters of the SHA-256 of terma.repository.root as a
      string: the cleaned, symlink-resolved absolute root, a linked worktree's own. Not
      content: it names no path, so it leaves under every policy, and whoever knows a root
      can recompute it. Only the hook that saw the edit stamps it.
    examples: ["ddc5e473a09bd156b4eb7c426367aa59"]
  - key: terma.repository.root
    type: string
    stability: development
    brief: The absolute path of the working tree the session or the git operation ran in.
    note: >
      A linked worktree's own root, not its main checkout's. A local path, so it leaves only
      while the team's policy collects tool content, as the paths in an agent's tool input do.
      On agent telemetry it is a resource attribute the relay stamps from the session's claim:
      the checkout the session's hooks last ran in, so a command that changes directory
      itself names a better one.
    annotations:
      content: tool
  - key: terma.working_directory
    type: string
    stability: development
    brief: The absolute path of the directory the session's agent hooks last ran in.
    note: >
      Symlink-resolved, inside a checkout or outside one. Where terma.repository.root is the
      checkout, this is where in it the agent works: what a tool call's relative paths and a
      bare git command resolve against, so a command that changes directory itself names a
      better one. Git hooks, which git runs at the checkout's root, never name it, so after a
      commit in another linked worktree of the same repository the two can name different
      checkouts until the next agent hook: do not assume the directory lies under the root.
      A local path, so it leaves only while the team's policy collects tool content. On
      agent telemetry it is a resource attribute the relay stamps from the session's claim.
    annotations:
      content: tool
  - key: terma.repository.worktree.linked
    type: boolean
    stability: development
    brief: Whether the session's checkout is a linked worktree of its repository, not its main checkout.
    note: >
      A linked worktree is one `git worktree add` made, as agent harnesses do to run sessions
      side by side. On agent telemetry it is a resource attribute the relay stamps from the
      session's claim, omitted outside git.
  - key: terma.repository.worktree.name
    type: string
    stability: development
    brief: Git's name for the linked worktree the session's hooks last ran in.
    note: >
      Its directory under the repository's .git/worktrees, which an agent harness often names
      after the task, so it leaves only while the team's policy collects tool content. The
      branch, often the same slug, leaves under any policy, as commit events send it: a branch
      is what a developer pushes to the remote, a worktree's directory is this machine's alone.
      Omitted in a main checkout. On agent telemetry it is a resource attribute the relay
      stamps from the session's claim.
    examples: ["feature-parser"]
    annotations:
      content: tool

  # The relay.
  - key: terma.relay.attribution
    type:
      members:
        - id: catch_all
          value: catch-all
          brief: Global mode placed the part in its default project.
          stability: development
        - id: process
          value: process
          brief: The part named no session; its process named one.
          stability: development
    stability: development
    brief: How the relay found the part's session when the part did not name it.
    note: A resource attribute the relay stamps.
  - key: terma.relay.session.id
    type: string
    stability: development
    brief: The session the relay inferred for a part that named none.
    note: A resource attribute the relay stamps.
  - key: terma.version
    type: string
    stability: development
    brief: The version of terma whose relay received the part from the agent.
    note: >-
      A resource attribute the relay stamps as it accepts the part, so a part queued across an
      upgrade keeps the version that accepted it. terma's own records name it in service.version.
    examples: ["0.2.3"]
  - key: terma.relay.heartbeat.reason
    type:
      members:
        - id: start
          value: start
          brief: The relay started.
          stability: development
        - id: interval
          value: interval
          brief: The heartbeat period passed.
          stability: development
        - id: setup
          value: setup
          brief: Setup finished; the platform reads it as installed and working.
          stability: development
        - id: doctor
          value: doctor
          brief: terma doctor found nothing queued to deliver and asked for a beat to prove delivery instead.
          stability: development
        - id: exit
          value: exit
          brief: The relay is about to stop, saying why it stopped.
          stability: development
    stability: development
    brief: Why the relay sent a heartbeat.
  - key: terma.relay.launch
    type:
      members:
        - id: service
          value: service
          brief: The service manager's relay (launchd, systemd, a Windows service).
          stability: development
        - id: hook
          value: hook
          brief: terma started it on demand, from an agent's hook or a terma command such as setup or update.
          stability: development
        - id: manual
          value: manual
          brief: A developer started it from the command line.
          stability: development
    stability: development
    brief: What started the relay.
    note: A resource attribute, so the platform tells a hook-started relay's bursts from a service relay's continuous heartbeat.
  - key: terma.install.method
    type:
      members:
        - id: script
          value: script
          brief: A release binary terma replaces itself, from the install script or a release archive downloaded by hand.
          stability: development
        - id: homebrew
          value: homebrew
          brief: Homebrew's, as a cask or a formula.
          stability: development
        - id: npm
          value: npm
          brief: The global npm package @miradorlabs/terma, or any npm install of it on Windows.
          stability: development
        - id: npm_project
          value: npm_project
          brief: >-
            A project's npm dependency, which the project's own lockfile pins; also another package
            manager's global install in npm's layout (yarn, pnpm or bun), which terma cannot tell apart.
          stability: development
        - id: source
          value: source
          brief: >-
            A build that is not a numbered release, wherever it is installed: go build or go install, or
            make on a commit that is not a release tag (make on a release tag builds that release).
          stability: development
    stability: development
    brief: How the relay's terma was installed, which says how it gets new releases.
    note: >-
      A resource attribute on the relay heartbeat, read once as the relay starts: an upgrade
      restarts the relay. Told from the binary's resolved path and terma's version alone, the
      version first: a build that is not a release is source wherever it is. Left off when
      the relay cannot find its own binary.
  - key: terma.update.auto
    type:
      members:
        - id: "on"
          value: "on"
          brief: The relay installs each new release by itself.
          stability: development
        - id: "off"
          value: "off"
          brief: It could, but automatic updates are off (`terma update --auto off`, or CI or TERMA_NO_UPDATE_CHECK=1 in the relay's environment).
          stability: development
        - id: unsupported
          value: unsupported
          brief: It cannot, whatever the developer chooses; update notices only.
          stability: development
    stability: development
    brief: Whether the relay installs new releases of its terma by itself.
    note: >-
      A record attribute on the relay heartbeat, read as each beat is sent, since the developer
      can turn automatic updates on or off while the relay runs. It is the relay's own
      decision, from the one rule its updater follows, so it never says on for a relay that
      would not update. A Homebrew or global npm install is on or off like the install
      script's: the relay upgrades a Homebrew install through Homebrew, and a global npm
      install's binary in place, never running npm. A source build, a project's npm
      dependency, a Windows binary, a binary the relay cannot find, and a Homebrew install
      without its brew are unsupported; so is an install whose directories the relay may not
      write (a root-owned npm prefix, another user's Homebrew, a binary installed with sudo),
      until that is put right.
  - key: terma.relay.exit.reason
    type:
      members:
        - id: asked
          value: asked
          brief: Asked to stop, or its process was signalled.
          stability: development
        - id: idle
          value: idle
          brief: It had been idle and no hold or queue kept it.
          stability: development
        - id: replaced
          value: replaced
          brief: A newer terma asked it to make way.
          stability: development
        - id: updated
          value: updated
          brief: It installed a newer terma and stopped to run it.
          stability: development
        - id: serve_failed
          value: serve-failed
          brief: Its server failed.
          stability: development
    stability: development
    brief: Why the relay stopped, on the heartbeat that says it is stopping.
  - key: terma.relay.heartbeat.counter
    type: template[int]
    stability: development
    brief: How many of each thing the relay counted since the previous heartbeat that carried counters, one attribute per counter.
    note: >-
      Aggregate, content-free health: records received, forwarded and dropped for each reason,
      and heartbeats sent and failed, each a delta since the last beat that carried counters
      (a failed beat's go with the next), so a relay's beats sum to what it counted up to its
      last delivered beat. A relay a hook or a developer started sends a last beat as it
      stops; the service's relay, which its manager restarts only once it exits, a killed
      relay, and a last beat that fails leave the rest in the relay's stats.json. The key's
      suffix is the relay's own counter
      name, every one pinned in internal/relay/counter_names_test.go, e.g.
      `terma.relay.heartbeat.counter.dropped.unclaimed_expired.logs`;
      the attributes the content policy met unclassified leave only as their total,
      `terma.relay.heartbeat.counter.unclassified`, never by name. A counter that did not move
      is left out.

  # The developer.
  - key: terma.user.id
    type: string
    stability: development
    brief: The Mirador user terma is signed in as, by id.
    note: >-
      On the relay heartbeat, a record attribute read as each beat is sent, since the developer
      can sign in, out or switch while the relay runs. On the resource of every part the relay
      forwards, for every agent, read as the relay accepts the part, and of every hook event
      terma delivers, read as the spool is flushed: an id, not a name, so it leaves under any
      content policy, and terma's to set, so whatever an agent sent under the key on the
      resource goes first. Left out when terma is signed out, signed in for another organization
      or environment than its profile's, or set up with a server key, and on anything that goes
      with any key but that of the team whose validated policy the login fetched, to any ingest
      but the profile's own, or with a key filed with another deployment's API host: such a key
      may belong to another organization or environment. Terma sets it, so the platform shows it
      and never authorizes with it.
    examples: ["5b0e5f8c-3c2a-4d1e-9f6b-2a7c8d9e0f11"]
