name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Actions are pinned to commits, and GoReleaser and npm to exact versions, so what a release
# runs is fixed in this file rather than resolved when the tag is pushed.

jobs:
  # The tagged commit's tests and the vulnerability scan run here, in a job that holds no
  # secret, rather than beside the signing key.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # A tag's run can restore the Go caches other runs saved; a release starts clean.
          cache: false

      - run: go test ./...

      # This binary holds credentials; a release with a vulnerable stdlib is worse
      # than a late release. Pinned so the scanner is a reproducible input.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    # The environment holds the release signing key and deploys from v* tags only, after
    # its required reviewer approves: a release cannot be signed without that approval.
    environment: release
    permissions:
      contents: write # create the GitHub Release and upload archives
      id-token: write # OIDC identity for signing the provenance attestation
      attestations: write # store the attestation with GitHub
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # GoReleaser builds the changelog from commit history; a shallow clone
          # produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # The build, and the signing helper GoReleaser runs with the key, compile from a
          # fresh module download checked against go.sum, never from a restored cache.
          cache: false

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Keep in step with the release-dry-run job in ci.yml.
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on miradorlabs/homebrew-tap. Without it the
          # release still publishes; only the cask update fails.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The release signing key (scripts/releasesign keygen); without it the release
          # fails, since terma would refuse to install it. Every command GoReleaser runs
          # sees it, so the environment's approval is what stands between a change to this
          # repository and the key.
          TERMA_SIGNING_KEY: ${{ secrets.TERMA_SIGNING_KEY }}

      # Signed build provenance for every published artifact, verifiable with
      # `gh attestation verify <file> --owner miradorlabs`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig
            install.sh

  # The npm shim (`npx @miradorlabs/terma`) downloads this exact release at
  # install time, so it is published after the archives exist.
  #
  # Trusted publishing: npm exchanges this job's OIDC token for a one-time
  # publish credential, so no NPM_TOKEN exists anywhere. The package trusts
  # exactly this repository, this workflow file and the `npm` environment (which
  # deploys from v* tags only); renaming any of the three breaks publishing until
  # the package's Trusted Publisher settings on npmjs.com are changed to match.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and npm provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. An exact
      # version, since this job can publish the package.
      - name: Update npm
        run: npm install -g npm@11.21.0
      - name: Publish shim
        working-directory: npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version
          npm publish --access public --provenance

  # A release is done when it installs the way the README says. The published
  # install.sh (the asset https://terma.ai/install.sh redirects to) on both
  # platforms, and on macOS the cask GoReleaser just pushed to the tap.
  smoke:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: curl | bash
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" \
            | TERMA_VERSION="${GITHUB_REF_NAME}" TERMA_INSTALL_DIR="${RUNNER_TEMP}/bin" bash
          got="$("${RUNNER_TEMP}/bin/terma" version)"
          [ "$got" = "terma ${GITHUB_REF_NAME#v}" ] || { echo "::error::install.sh installed '$got'"; exit 1; }

      - name: brew install
        if: runner.os == 'macOS'
        run: |
          brew tap miradorlabs/tap
          brew trust miradorlabs/tap || true # Homebrew >= 6 will not load an untrusted third-party tap
          # GoReleaser pushed the cask before this job began, so `brew tap` normally
          # already has it; the retry only covers a slow fetch.
          cask="$(brew --repository)/Library/Taps/miradorlabs/homebrew-tap/Casks/terma.rb"
          for attempt in 1 2 3 4 5 6; do
            grep -qF "version \"${GITHUB_REF_NAME#v}\"" "$cask" && break
            if [ "$attempt" -eq 6 ]; then
              echo "::error::tap still has '$(grep -m1 '^  version' "$cask")' for ${GITHUB_REF_NAME}"; exit 1
            fi
            sleep 20; brew update --quiet
          done
          brew install --cask miradorlabs/tap/terma
          got="$("$(brew --prefix)/bin/terma" version)"
          [ "$got" = "terma ${GITHUB_REF_NAME#v}" ] || { echo "::error::brew installed '$got'"; exit 1; }
