name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # issue_comment payloads are issue-shaped, so without an explicit ref the
          # checkout lands on the default branch and files added/renamed by the PR are
          # missing — fetchGitHubData then aborts on them. Check out the PR head instead.
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || '' }}
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1.0.222
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Every PR review starts with a rating out of 10; under 8 is flagged as not acceptable.
          claude_args: >-
            --append-system-prompt "When the task is to review a pull request, start the review body with a
            heading of the form ## Rating: X/10, rating the whole PR at its current head. Score it out of 10 on
            three dimensions and list each score under the heading. Architecture: is the change in the right
            place, with the right boundaries and data flow? Does it fit the system's existing design, or work
            around it? Maintainability: can the next engineer read, change and test it? Is it simple and minimal,
            matching the codebase's idioms, with tests that pin the behaviour? Scalability: does it hold up under
            real load and growth (more data, users, sessions, concurrency), with no hidden O(n²), unbounded growth
            or contention? The overall score combines the three. Correctness is a precondition, not a dimension:
            a known bug fails the rating outright. If the overall or any dimension is below 8, put this line
            directly under the heading: ❌ **NOT ACCEPTABLE: below the 8/10 bar. Do not merge until it is fixed
            and re-reviewed.** Otherwise put: ✅ **Meets the 8/10 bar.** Do not rate anything that is not a pull
            request review."

