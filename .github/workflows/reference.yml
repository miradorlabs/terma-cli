name: Harness Reference new builds

# Harnesses release more often than nightly: every quarter hour, a check asks each registry
# for builds the Harness Reference has not published (test/e2e/reference/new-builds.sh, a
# few requests and no build), and only when there are, captures those builds' profiles on
# macOS, and Claude Code's and Codex's files profiles on Linux, and the desktop apps' (Claude
# Desktop's, the Codex app's) on a macOS runner of their own, and publishes them (refgen,
# publish.sh publish-reference). The new CLI builds' contracts run too, on macOS, and the matrix
# they extend is published with the reference, so a new build's page says whether terma works
# with it within the hour rather than the next night. The nightly E2E harness contracts
# (live.yml) still run every contract on both platforms and the field census.

on:
  schedule:
    # Off the hour and its quarters, when GitHub delays scheduled runs most.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One at a time: a capture can outlast the quarter hour, and the next check must see what it
# published rather than capture the same build again.
concurrency:
  group: harness-reference-new-builds
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.new.outputs.builds }}
      tests: ${{ steps.new.outputs.tests }}
      harnesses: ${{ steps.new.outputs.harnesses }}
      claude: ${{ steps.new.outputs.claude }}
      codex: ${{ steps.new.outputs.codex }}
      gemini: ${{ steps.new.outputs.gemini }}
      opencode: ${{ steps.new.outputs.opencode }}
      copilot: ${{ steps.new.outputs.copilot }}
      dsh: ${{ steps.new.outputs.dsh }}
      claude_desktop: ${{ steps.new.outputs.claude_desktop }}
      codex_desktop: ${{ steps.new.outputs.codex_desktop }}
      desktop_tests: ${{ steps.new.outputs.desktop_tests }}
      contracts: ${{ steps.new.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The script, and what it builds its version sort from: refdiff, which needs no
          # module but the standard library.
          sparse-checkout: |
            test/e2e/reference/new-builds.sh
            test/e2e/go.mod
            test/e2e/go.sum
            test/e2e/refdiff/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/e2e/go.mod
          cache: false
      - name: Ask the registries what is new
        id: new
        run: |
          builds=$(test/e2e/reference/new-builds.sh)
          if [ -z "$builds" ]; then
            echo 'Nothing new since the reference was last published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Each new harness's scenarios, by the name its tests carry; a desktop app's are its
          # job's own (capture-desktop).
          # Harnesses other than Claude Code and Codex also share the TestHarnessProbe*
          # scenarios (across turns, retries, tool output), each a subtest by harness: the run
          # takes those too, for the new harnesses alone (TERMA_E2E_HARNESSES).
          names=()
          desktop=()
          shared=()
          contracts=()
          while IFS='=' read -r harness versions; do
            echo "${harness//-/_}=$versions" >> "$GITHUB_OUTPUT"
            case "$harness" in
              claude|codex|gemini|opencode|copilot|dsh) contracts+=("$harness") ;;
            esac
            case "$harness" in
              claude|codex) names+=("$(tr '[:lower:]' '[:upper:]' <<<"${harness:0:1}")${harness:1}") ;;
              opencode) names+=(OpenCode); shared+=(opencode) ;;
              claude-desktop) desktop+=(TestClaudeDesktopProfile) ;;
              codex-desktop) desktop+=(TestCodexDesktopProfile) ;;
              *) names+=("$(tr '[:lower:]' '[:upper:]' <<<"${harness:0:1}")${harness:1}"); shared+=("$harness") ;;
            esac
          done <<<"$builds"
          if [ ${#names[@]} -gt 0 ]; then
            tests="^Test($(IFS='|'; echo "${names[*]}"))(Profile|Probe)"
            if [ ${#shared[@]} -gt 0 ]; then
              tests="$tests|^TestHarnessProbe(AcrossTurns|Retries|ToolOutput)\$"
              echo "harnesses=$(IFS=','; echo "${shared[*]}")" >> "$GITHUB_OUTPUT"
            fi
            echo "tests=$tests" >> "$GITHUB_OUTPUT"
          fi
          if [ ${#desktop[@]} -gt 0 ]; then
            echo "desktop_tests=^($(IFS='|'; echo "${desktop[*]}"))\$" >> "$GITHUB_OUTPUT"
          fi
          if [ ${#contracts[@]} -gt 0 ]; then
            echo "contracts=$(IFS=','; echo "${contracts[*]}")" >> "$GITHUB_OUTPUT"
          fi
          { echo 'builds<<EOF'; echo "$builds"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          { echo '| harness | new builds |'; echo '|---|---|'; sed 's/=/ | /; s/^/| /; s/$/ |/' <<<"$builds"; } >> "$GITHUB_STEP_SUMMARY"

  capture:
    needs: detect
    if: needs.detect.outputs.tests != ''
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # No token left in .git/config: this job runs vendor builds, and pushes nothing.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/e2e/go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build native test binaries
        run: |
          go build -o test/e2e/bin/terma ./cmd/terma
          cd test/e2e
          go test -c -o bin/e2e.test .
      # No account: every model request goes to the scenarios' fixture providers. A build's
      # scenario that fails still leaves its profile, partial, and refgen says so. The tests
      # include Claude Code's and Codex's files profiles, traced with eslogger, which the hosted
      # runner allows as root.
      - name: Capture the new builds
        working-directory: test/e2e
        env:
          TERMA_E2E: "1"
          TERMA_E2E_BINARY: ${{ github.workspace }}/test/e2e/bin/terma
          TERMA_E2E_UNCLASSIFIED: note
          TERMA_E2E_KNOWN_UPSTREAM: codex-session-end
          TERMA_E2E_CLAUDE_VERSIONS: ${{ needs.detect.outputs.claude }}
          TERMA_E2E_CODEX_VERSIONS: ${{ needs.detect.outputs.codex }}
          TERMA_E2E_GEMINI_VERSIONS: ${{ needs.detect.outputs.gemini }}
          TERMA_E2E_OPENCODE_VERSIONS: ${{ needs.detect.outputs.opencode }}
          TERMA_E2E_COPILOT_VERSIONS: ${{ needs.detect.outputs.copilot }}
          TERMA_E2E_DSH_VERSIONS: ${{ needs.detect.outputs.dsh }}
          TERMA_E2E_HARNESSES: ${{ needs.detect.outputs.harnesses }}
          TESTS: ${{ needs.detect.outputs.tests }}
        run: ./bin/e2e.test -test.v -test.timeout 50m -test.run "$TESTS"
      - name: Upload the profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profiles-macos
          path: test/e2e/report/profiles.json
          if-no-files-found: ignore
          retention-days: 30

  # The files profile of the new Claude Code and Codex builds on Linux, traced with strace in
  # the machine image (test/e2e/machine/Dockerfile, `make machines`), beside macOS's capture: the
  # snapshot's filesystem section for linux/amd64.
  capture-linux:
    needs: detect
    if: needs.detect.outputs.claude != '' || needs.detect.outputs.codex != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # No token left in .git/config: this job runs vendor builds, and pushes nothing.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # As the nightly machine job: Codex's bubblewrap needs capabilities in its user namespace.
      - name: Let sandboxes have capabilities in their user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Trace the new builds
        working-directory: test/e2e
        env:
          TERMA_E2E_UNCLASSIFIED: note
          CLAUDE_BUILDS: ${{ needs.detect.outputs.claude }}
          CODEX_BUILDS: ${{ needs.detect.outputs.codex }}
        run: |
          # Only the harnesses with new builds: an empty version list would mean the default ones.
          tests=()
          [ -n "$CLAUDE_BUILDS" ] && tests+=(TestClaudeProfileFiles)
          [ -n "$CODEX_BUILDS" ] && tests+=(TestCodexProfileFiles)
          run="^($(IFS='|'; echo "${tests[*]}"))\$"
          make machines HOST_ARCH=amd64 CLAUDE_VERSION=latest CODEX_VERSION=latest \
            MACHINE_CLAUDE_VERSIONS="${CLAUDE_BUILDS:-installed}" MACHINE_CODEX_VERSIONS="${CODEX_BUILDS:-installed}" RUN="$run"
      - name: Upload the profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profiles-linux
          path: test/e2e/report/linux/profiles.json
          if-no-files-found: ignore
          retention-days: 30

  # The desktop apps' profiles (test/e2e/profile_desktop_test.go): each new release, from its
  # update feed, run whole on a machine of its own, as the scenarios change machine-wide settings
  # (an organization's managed preferences, a trusted CA for the recording proxy) and put them back.
  capture-desktop:
    needs: detect
    if: needs.detect.outputs.desktop_tests != ''
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # No token left in .git/config: this job runs vendor builds, and pushes nothing.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/e2e/go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - name: Build native test binaries
        run: |
          go build -o test/e2e/bin/terma ./cmd/terma
          cd test/e2e
          go test -c -o bin/e2e.test .
      # The runner's user as a new Mac's: zsh, the macOS default, its login shell, and none of the
      # image's shell startup files, so an app's agent gets a stock login shell's environment.
      - name: A new Mac's user
        run: |
          sudo dscl . -create "/Users/$USER" UserShell /bin/zsh
          for f in .bash_profile .bashrc .profile .zshrc .zprofile .zshenv .zlogin .zlogout; do
            if [ -e "$HOME/$f" ]; then mv "$HOME/$f" "$HOME/$f.runner-image"; fi
          done
      - name: Capture the new desktop releases
        working-directory: test/e2e
        env:
          TERMA_E2E: "1"
          TERMA_E2E_DESKTOP_APPS: "1"
          TERMA_E2E_BINARY: ${{ github.workspace }}/test/e2e/bin/terma
          TERMA_E2E_UNCLASSIFIED: note
          TERMA_E2E_CLAUDE_DESKTOP_APP_VERSIONS: ${{ needs.detect.outputs.claude_desktop }}
          TERMA_E2E_CODEX_DESKTOP_APP_VERSIONS: ${{ needs.detect.outputs.codex_desktop }}
          TESTS: ${{ needs.detect.outputs.desktop_tests }}
        run: ./bin/e2e.test -test.v -test.timeout 40m -test.run "$TESTS"
      - name: Upload the profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profiles-desktop
          path: test/e2e/report/profiles.json
          if-no-files-found: ignore
          retention-days: 30

  # Whether terma works with the new builds: every contract of their harnesses, as the nightly
  # runs them (live.yml), against these builds alone (TERMA_E2E_ONLY and the versions). Its rows
  # extend the matrix the publish job renders the reference's verdict from.
  contracts:
    needs: detect
    if: needs.detect.outputs.contracts != ''
    runs-on: macos-latest
    timeout-minutes: 90
    environment: live-harnesses
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/e2e/go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build native test binaries
        run: |
          go build -o test/e2e/bin/terma ./cmd/terma
          cd test/e2e
          go test -c -o bin/e2e.test .
      - name: Run the new builds' contracts
        working-directory: test/e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TERMA_E2E: "1"
          TERMA_E2E_BINARY: ${{ github.workspace }}/test/e2e/bin/terma
          TERMA_E2E_REPORT: report-contracts
          TERMA_E2E_UNCLASSIFIED: note
          TERMA_E2E_KNOWN_UPSTREAM: codex-session-end
          TERMA_E2E_ONLY: ${{ needs.detect.outputs.contracts }}
          TERMA_E2E_CLAUDE_VERSIONS: ${{ needs.detect.outputs.claude }}
          TERMA_E2E_CODEX_VERSIONS: ${{ needs.detect.outputs.codex }}
          TERMA_E2E_GEMINI_VERSIONS: ${{ needs.detect.outputs.gemini }}
          TERMA_E2E_OPENCODE_VERSIONS: ${{ needs.detect.outputs.opencode }}
          TERMA_E2E_COPILOT_VERSIONS: ${{ needs.detect.outputs.copilot }}
          TERMA_E2E_DSH_VERSIONS: ${{ needs.detect.outputs.dsh }}
        # The capture job takes the profiles and probes.
        run: ./bin/e2e.test -test.v -test.timeout 75m -test.skip '(Profile|Probe)'
      - name: Upload the contracts' rows
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-macos
          path: test/e2e/report-contracts/compat.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [detect, capture, capture-linux, capture-desktop, contracts]
    # A capture that failed outright still publishes its builds, partial, so the next check
    # does not take them for new again; the night tries them again. A desktop app's release is
    # the exception: the night does not capture the apps, so one whose capture failed is not
    # published as tried, and the next check takes it for new and tries it again.
    if: always() && needs.detect.outputs.builds != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # For the Slack webhook the announcements are posted with.
    environment: live-harnesses
    permissions:
      contents: write
    # The nightly compat job (live.yml) publishes the same branch: never both at once.
    concurrency:
      group: compat-matrix
      cancel-in-progress: false
    steps:
      # Keeps its token: this job pushes to compat-matrix (publish.sh).
      - uses: actions/checkout@v7
      - name: Start from the published reference
        run: test/e2e/compatgen/publish.sh restore
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/e2e/go.mod
          cache-dependency-path: test/e2e/go.sum
      # macOS's profiles and Linux's files profiles, each in a folder of its own.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: profiles-*
          path: test/e2e/runs
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: compat-*
          path: test/e2e/runs
      - name: Render the reference
        working-directory: test/e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDS: ${{ needs.detect.outputs.builds }}
          DESKTOP_CAPTURE: ${{ needs.capture-desktop.result }}
        run: |
          mkdir -p runs
          # The contracts' rows first, so the verdict refgen gives each build is theirs.
          rows=()
          for f in $(find runs -name compat.json | sort); do rows+=(-run "$f"); done
          if [ ${#rows[@]} -gt 0 ]; then
            go run ./compatgen "${rows[@]}"
            echo "TERMA_REFERENCE_MATRIX=1" >> "$GITHUB_ENV"
          fi
          args=()
          for f in $(find runs -name profiles.json | sort); do args+=(-profiles "$f"); done
          while read -r line; do
            case "$line" in
              claude-desktop=*|codex-desktop=*) [ "$DESKTOP_CAPTURE" = success ] || continue ;;
            esac
            args+=(-attempted "$line")
          done <<<"$BUILDS"
          # Every step stays in timeline.json (-timeline-steps 1000) until the reader's pages
          # load the timeline-<n>.json archives; then the default pages it.
          go run ./refgen "${args[@]}" -catalog ../../docs/compat/fields.json -history ../../docs/compat/history.json -compat ../../docs/compat/compat.json -out ../../docs/harnesses -timeline-steps 1000 -fetch -source -announce "$RUNNER_TEMP/announcements.json"
          # The comparison of any two versions, run in the reader's browser: the same code that
          # made the diffs, built reproducibly, so an unchanged engine is no change on the branch.
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../../docs/harnesses/refdiff.wasm ./refdiff/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../../docs/harnesses/wasm_exec.js
      - name: Publish the reference
        env:
          BUILDS: ${{ needs.detect.outputs.builds }}
        run: TERMA_REFERENCE_BUILDS="$(paste -sd' ' - <<<"$BUILDS")" test/e2e/compatgen/publish.sh publish-reference
      # Each version newer than any captured before, once, after it is published: never a
      # backfill, never twice. SLACK_RELEASES_WEBHOOK_URL picks a channel of its own; without
      # it, the digest's.
      - name: Announce new versions
        if: success()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          news="$RUNNER_TEMP/announcements.json"
          [ -s "$news" ] || exit 0
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::No Slack webhook in the live-harnesses environment: $(jq length "$news") new versions not announced."
            exit 0
          fi
          jq -c '.[].slack' "$news" | while read -r message; do
            curl -fsS -X POST -H 'Content-Type: application/json' --data "$message" "$SLACK_WEBHOOK_URL"
          done
