name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: a dependency with no code change of ours can still become vulnerable.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: govulncheck
            module: .
          - name: govulncheck (live)
            module: live
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # ./... does not cross module boundaries: scan the live harness separately,
      # including its test code. The scanner is pinned; its vulnerability database
      # is fetched fresh at run time.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...
