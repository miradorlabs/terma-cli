name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: a dependency with no code change of ours can still become vulnerable.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Covers our dependencies and the Go standard library the binary is built
      # against. Pinned so the scanner itself is a reproducible input; the
      # vulnerability database is still fetched fresh at run time.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
