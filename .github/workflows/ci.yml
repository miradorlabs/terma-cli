name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  npm-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - run: npm test --prefix npm

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # The version lives in .golangci-lint-version, which `make lint` reads too.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      - run: go test -race ./...

      # The hook budget is a product guarantee, not a nice-to-have: a
      # prepare-commit-msg that gets slow gets uninstalled.
      - name: Hook latency budget
        run: make bench-hook

  # What has a Windows implementation of its own — LockFileEx, the relay's sender from the
  # TCP table and parents from a process snapshot, the Run-key service and its
  # supervisor, the stop file, the zip archive and the rename-aside swap — and no other
  # job runs. Also vets the whole module for Windows, so nothing Unix-only creeps back in.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Relay, locking, process lookups and updater on Windows
        run: go test ./internal/relay/... ./internal/flock/... ./internal/procinfo/... ./internal/selfupdate/... -count=1 -timeout=5m

  # The live suite is a separate module; its offline contracts must run in CI too.
  live-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/live
    env:
      TERMA_LIVE: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/live/go.mod
          cache-dependency-path: test/live/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  # Real harness exporters, deterministic loopback model responses and OTLP.
  # Pin PR builds; live.yml also checks the latest releases nightly.
  harness-telemetry:
    runs-on: macos-latest
    timeout-minutes: 70
    env:
      TERMA_ENV: dev
      TERMA_LIVE: "1"
      TERMA_LIVE_CLAUDE_VERSIONS: "2.1.283"
      TERMA_LIVE_CODEX_VERSIONS: "0.158.0"
      TERMA_LIVE_OPENCODE_VERSIONS: "1.18.33"
      TERMA_LIVE_GEMINI_VERSIONS: "0.62.0"
      TERMA_LIVE_DSH_VERSIONS: "0.2.0-rc.2"
      TERMA_LIVE_BINARY: ${{ github.workspace }}/live/bin/terma
      # Codex 0.158.0 sometimes exits without running its SessionEnd hook, with or
      # without Terma (docs/CODEX-SESSION-END.md). Pull requests report it instead of
      # failing on it; the nightly live workflow stays strict.
      TERMA_LIVE_KNOWN_UPSTREAM: codex-session-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/live/go.mod
          cache-dependency-path: |
            go.sum
            test/live/go.sum
      - name: Build Terma
        run: go build -o test/live/bin/terma ./cmd/terma
      # Pi has no exporter; terma's extension is one, tested only on the installed
      # build (test/live/pi.go).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Pi and T3 Code
        # Pi has no exporter (terma's extension is one); T3 Code runs Codex and Claude
        # Code itself. Gemini CLI and DeepSeek Harness install on demand (test/live/gemini.go,
        # test/live/dsh.go). Hermes, omp and Cursor run only where installed or credentialed.
        run: npm install -g @earendil-works/pi-coding-agent@0.99.1 t3@0.0.42
      - name: Assert harness telemetry (no provider credentials)
        working-directory: test/live
        # TestRelay* is the local relay (docs/RELAY.md): the same
        # harnesses exporting globally through `terma relay run`, and nothing but the
        # claimed session reaching the receiver.
        run: go test -v -count=1 -timeout=65m -run '^(TestClaudeTelemetry|TestCodexTelemetry|TestClaudeStopFailureDelivery|TestRelay.*|TestPi.*|TestGemini.*|TestDsh.*|TestHermes.*)$' .
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f test/live/report/latest.md ]; then
            cat test/live/report/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

  cursor-billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/cursor-billing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: prototypes/cursor-billing/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # The funding model is a proof of concept, but it is the estimator the backend
  # will be reconciled against, so a change that breaks its tests should not pass
  # review only because the module lives under prototypes/.
  funding-model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/funding-model
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: prototypes/funding-model/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  # The OpenCode plugin is ~450 lines of JavaScript that writes into a user's
  # plugin directory and ships in the release archives. `make test-plugin` skips it
  # wherever bun is absent, so CI is where it is actually run.
  opencode-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/agents/opencode/plugin
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test

  # The shim scripts are committed into customers' repositories: they must be
  # POSIX sh, and they must keep working on the sh that Debian/Alpine ship.
  shim-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o bin/terma ./cmd/terma
      - name: Shim runs under dash and busybox sh
        env:
          TERMA_POLICY_STUB: '{"mode":"repo","include_prompts":true,"include_tool_content":true}'
        run: |
          sudo apt-get install -y -q dash busybox >/dev/null
          tmp=$(mktemp -d); cd "$tmp"; git init -q; git config user.email t@example.com; git config user.name t
          "$GITHUB_WORKSPACE/bin/terma" install --project proj_ci --harness none --yes >/dev/null
          for sh in dash "busybox sh"; do
            echo "subject" > msg.txt
            $sh .terma/hooks/prepare-commit-msg msg.txt message
            $sh .terma/hooks/post-commit
          done
          echo "ok"

  # Everything a release publishes, rendered with the committed GoReleaser config
  # from a throwaway tag that never leaves the runner: every platform
  # cross-compiles, and the cask's download URL carries v#{version} exactly as a
  # real release's does (a --snapshot build's would not, and `brew audit` rejects
  # it). Nothing is published. The two jobs after this one install what it built.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: git tag v0.0.0-ci
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # `before` is `go test`, which the test job already runs.
          args: release --clean --skip=publish,validate,announce,before
        env:
          # Read only by the cask template; the dry run pushes nothing.
          HOMEBREW_TAP_TOKEN: dry-run
      - uses: actions/upload-artifact@v5
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/homebrew/
          retention-days: 1
          if-no-files-found: error

  # `curl -fsSL https://terma.ai/install.sh | bash`, against those archives served
  # over loopback: pinned and latest, piped through bash and under sh, plus the two
  # refusals (checksum mismatch, cleartext). scripts/test-install.sh.
  install-script:
    needs: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-dry-run
          path: dist
      - name: shellcheck
        run: |
          shellcheck -s sh install.sh
          shellcheck scripts/test-install.sh scripts/test-cask.sh
      - run: ./scripts/test-install.sh dist v0.0.0-ci

  # `brew install miradorlabs/tap/terma`, with the cask the release would push:
  # `brew audit --strict`, then a real install from a throwaway local tap whose
  # URLs point at the loopback mirror — download, sha256, the preflight that strips
  # the quarantine flag, completions generated by running the binary, the link.
  # scripts/test-cask.sh.
  homebrew-cask:
    needs: release-dry-run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-dry-run
          path: dist
      # The runner image's Homebrew can be weeks behind what users get from the
      # auto-update `brew install` runs; the cask relies on a stanza from 2026-08.
      - run: brew update --quiet
      - run: ./scripts/test-cask.sh dist v0.0.0-ci
