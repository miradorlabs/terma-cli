name: Live harness contracts

on:
  workflow_dispatch:
    inputs:
      include_subscriptions:
        description: Also test Claude and Codex subscription logins
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: live-harness-contracts
  cancel-in-progress: false

jobs:
  live:
    runs-on: macos-latest
    timeout-minutes: 90
    environment: live-harnesses
    permissions:
      contents: read
      id-token: write
    env:
      INCLUDE_SUBSCRIPTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_subscriptions || false }}
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_0171h2kkJshPaiHxCxTmsF1F
      ANTHROPIC_ORGANIZATION_ID: 0a8c23d6-3675-41b0-9a37-31be453eadb1
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01YCaxYCodudV3vAUrEyWTah
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Ug36g2VPKLUSFZ9LZXFTvU
      TERMA_LIVE_CLAUDE_VERSIONS: last3
      TERMA_LIVE_CODEX_VERSIONS: last3
      TERMA_LIVE_OPENCODE_VERSIONS: last3
      TERMA_LIVE_GEMINI_VERSIONS: last3
      TERMA_LIVE_DSH_VERSIONS: last3
      TERMA_LIVE_KNOWN_UPSTREAM: codex-session-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/live/go.mod
          cache-dependency-path: |
            go.sum
            test/live/go.sum
      - name: Require coverage credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.include_subscriptions && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CODEX_AUTH_JSON: ${{ inputs.include_subscriptions && secrets.CODEX_AUTH_JSON || '' }}
        run: |
          required=(OPENAI_API_KEY)
          if [ "$INCLUDE_SUBSCRIPTIONS" = "true" ]; then
            required+=(CLAUDE_CODE_OAUTH_TOKEN CODEX_AUTH_JSON)
          fi
          for key in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::GitHub OIDC unavailable: $key"
              exit 1
            fi
          done
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing live-harnesses secret: $key"
              exit 1
            fi
          done
          if [ "$INCLUDE_SUBSCRIPTIONS" != "true" ]; then
            echo 'API contracts enabled. Subscription coverage: **not run** (manual opt-in).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'API and subscription contracts enabled.' >> "$GITHUB_STEP_SUMMARY"
          umask 077
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/terma-codex-auth.json"
          printf 'TERMA_LIVE_CODEX_AUTH=%s/terma-codex-auth.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Pi and T3 Code (latest)
        run: npm install -g @earendil-works/pi-coding-agent t3
      - name: Build native test binaries
        run: |
          go build -o test/live/bin/terma ./cmd/terma
          cd test/live
          go test -c -o bin/live.test .
      - name: Run live contracts (subscription coverage is opt-in)
        working-directory: test/live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.include_subscriptions && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          TERMA_LIVE: "1"
          TERMA_LIVE_BINARY: ${{ github.workspace }}/test/live/bin/terma
        run: ./bin/live.test -test.v -test.timeout 75m
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f test/live/report/latest.md ]; then
            cat test/live/report/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-harness-report
          path: test/live/report/
          retention-days: 7
      - name: Upload this platform's compatibility rows
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: compat-macos
          path: test/live/report/compat.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary login
        if: always()
        run: rm -f "$RUNNER_TEMP/terma-codex-auth.json"

  # The same night on a fresh Linux machine (test/live/machine/Dockerfile): global mode, the
  # managed configuration and the core relay contracts with real Claude Code and Codex.
  machines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run the machine scenarios
        working-directory: test/live
        # The agents' newest releases; the rows record the versions they turn out to be.
        run: make machines HOST_ARCH=amd64 CLAUDE_VERSION=latest CODEX_VERSION=latest
      - name: Upload this platform's compatibility rows
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: compat-linux
          path: test/live/report/linux/compat.json
          if-no-files-found: ignore
          retention-days: 30

  # The matrix: this night's rows from both platforms merged into the history, rendered
  # as docs/COMPATIBILITY.md and docs/compat/compat.json (the website's data), published
  # as an artefact and the run's summary. The history lives on the compat-matrix
  # branch, which each scheduled run extends and pushes: that branch's
  # docs/compat/compat.json is the published matrix.
  compat:
    needs: [live, machines]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Start from the published history
        run: |
          if git fetch -q origin compat-matrix 2>/dev/null; then
            git show origin/compat-matrix:docs/compat/history.json > docs/compat/history.json || true
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/live/go.mod
          cache-dependency-path: test/live/go.sum
      - uses: actions/download-artifact@v5
        with:
          pattern: compat-*
          path: test/live/runs
      - name: Render the matrix
        working-directory: test/live
        run: |
          runs=$(find runs -name compat.json | sort | sed 's/^/-run /' | tr '\n' ' ')
          if [ -z "$runs" ]; then
            echo "No compatibility rows this night." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go run ./compatgen $runs
          cat ../../docs/COMPATIBILITY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: compatibility-matrix
          path: |
            docs/COMPATIBILITY.md
            docs/compat/
          retention-days: 90
      - name: Publish to the compat-matrix branch
        if: github.event_name == 'schedule'
        run: |
          set -e
          tmp=$(mktemp -d)
          cp -R docs/COMPATIBILITY.md docs/compat "$tmp/"
          git config user.name "terma-compat"
          git config user.email "terma-compat@users.noreply.github.com"
          if git rev-parse -q --verify origin/compat-matrix >/dev/null; then
            git checkout -q -B compat-matrix origin/compat-matrix
          else
            git checkout -q --orphan compat-matrix
            git rm -rq --cached . && git clean -fdxq
          fi
          mkdir -p docs
          rm -rf docs/compat
          cp -R "$tmp/COMPATIBILITY.md" docs/COMPATIBILITY.md
          cp -R "$tmp/compat" docs/compat
          git add docs/COMPATIBILITY.md docs/compat
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "compat: nightly matrix, $(date -u +%F)"
          git push -q origin compat-matrix
