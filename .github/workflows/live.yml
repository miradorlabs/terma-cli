name: E2E harness contracts

# Every night, terma's contracts against the builds people run: the newest build each harness
# was checked on and every release since (versions.go, "checked"), with this night's terma, on
# macOS and on a Linux machine. The matrix, the field catalog and each build's verdict on the
# Harness Reference follow. The builds of the harnesses the reference's frequent check watches
# (reference.yml, reference/new-builds.sh) were captured there, once and whole, when they came
# out: the night does not capture them again, and captures only the harnesses it does not watch.

on:
  workflow_dispatch:
    inputs:
      include_subscriptions:
        description: Also test Claude and Codex subscription logins
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-harness-contracts
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 90
    environment: live-harnesses
    permissions:
      contents: read
    env:
      INCLUDE_SUBSCRIPTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_subscriptions || false }}
      # The newest build each harness was checked on here, on macOS, and every release since,
      # the newest five of a burst (versions.go, sinceChecked): the build people run keeps
      # being tested, and what is new is judged against it the same night. Without the
      # published history, the last three releases. DeepSeek ships prereleases alone, which
      # "checked" does not pick: its newest build, as before.
      TERMA_E2E_CLAUDE_VERSIONS: checked
      TERMA_E2E_CODEX_VERSIONS: checked
      TERMA_E2E_OPENCODE_VERSIONS: checked
      TERMA_E2E_GEMINI_VERSIONS: checked
      TERMA_E2E_DSH_VERSIONS: last3
      TERMA_E2E_KNOWN_UPSTREAM: codex-session-end
      # A field the relay has not classified is a note here, not a failure: the digest says
      # what is new to classify, and a harness sending it still sends what terma expects.
      TERMA_E2E_UNCLASSIFIED: note
    steps:
      # No token left in .git/config: this job runs vendor builds, and pushes nothing.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/e2e/go.mod
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      # Every contract that needs no account runs against local fixture providers. One that
      # needs an account runs where the environment has its secret and is skipped where it has
      # not, which the summary says: a missing secret narrows the night, it does not fail it.
      # Subscription coverage, asked for by hand, does need its secrets.
      - name: Say which accounts this run has
        env:
          # Whether each key is set, not the key: this step needs no more.
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.include_subscriptions && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CODEX_AUTH_JSON: ${{ inputs.include_subscriptions && secrets.CODEX_AUTH_JSON || '' }}
        run: |
          {
            echo '| account | contracts |'
            echo '|---|---|'
            for key in OPENAI_API_KEY ANTHROPIC_API_KEY; do
              has="HAS_$key"
              if [ "${!has}" = "true" ]; then echo "| \`$key\` | will run |"; else echo "| \`$key\` | **skipped**: not set in live-harnesses |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$INCLUDE_SUBSCRIPTIONS" != "true" ]; then
            echo 'Subscription coverage: **not run** (manual opt-in).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for key in CLAUDE_CODE_OAUTH_TOKEN CODEX_AUTH_JSON; do
            if [ -z "${!key}" ]; then
              echo "::error::Subscription coverage was asked for, but live-harnesses has no $key"
              exit 1
            fi
          done
          echo 'Subscription contracts enabled.' >> "$GITHUB_STEP_SUMMARY"
          umask 077
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/terma-codex-auth.json"
          printf 'TERMA_E2E_CODEX_AUTH=%s/terma-codex-auth.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Pi and T3 Code (latest)
        run: npm install -g @earendil-works/pi-coding-agent t3
      - name: Read which builds the published history checked
        run: |
          if git fetch -q --depth 1 origin compat-matrix && git show FETCH_HEAD:docs/compat/history.json > "$RUNNER_TEMP/history.json"; then
            echo "TERMA_E2E_CHECKED=$RUNNER_TEMP/history.json" >> "$GITHUB_ENV"
          else
            echo "::notice::No published history: each harness's last three releases are tested."
          fi
      - name: Build native test binaries
        run: |
          go build -o test/e2e/bin/terma ./cmd/terma
          cd test/e2e
          go test -c -o bin/e2e.test .
      # The frequent check captured the watched harnesses' builds whole: their reference scenarios
      # (profile and probes) are not run again here, and the shared probes run for the rest.
      - name: Leave the frequent check's captures to it
        working-directory: test/e2e
        run: |
          echo "TERMA_E2E_REFERENCE_SKIP=$(reference/scenarios.sh skip)" >> "$GITHUB_ENV"
          echo "TERMA_E2E_HARNESSES=$(reference/scenarios.sh unwatched)" >> "$GITHUB_ENV"
      - name: Run e2e contracts (subscription coverage is opt-in)
        working-directory: test/e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.include_subscriptions && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          TERMA_E2E: "1"
          TERMA_E2E_BINARY: ${{ github.workspace }}/test/e2e/bin/terma
        run: ./bin/e2e.test -test.v -test.timeout 75m -test.skip "$TERMA_E2E_REFERENCE_SKIP"
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f test/e2e/report/latest.md ]; then
            cat test/e2e/report/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-harness-report
          path: test/e2e/report/
          retention-days: 7
      - name: Upload this platform's compatibility rows
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-macos
          path: |
            test/e2e/report/compat.json
            test/e2e/report/notes.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload this platform's field census
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fields-macos
          path: |
            test/e2e/report/fields.json
            test/e2e/report/census.json
          if-no-files-found: ignore
          retention-days: 30
      # What each build sends its provider on a user's first turn, and its help: the evidence
      # each build's published snapshot is normalized from (profile.go). It holds each build's
      # macOS files profile too: the hosted runner lets `sudo -n eslogger` create its Endpoint
      # Security client, so the run above traces them (profile_files_test.go).
      - name: Upload this platform's harness profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profiles-macos
          path: test/e2e/report/profiles.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove temporary login
        if: always()
        run: rm -f "$RUNNER_TEMP/terma-codex-auth.json"

  # The same night on a fresh Linux machine (test/e2e/machine/Dockerfile): global mode, the
  # managed configuration and the core relay contracts with real Claude Code and Codex. Their
  # files profiles are the frequent check's, taken once a build (reference.yml).
  machines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # No token left in .git/config: this job runs vendor builds, and pushes nothing.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ubuntu 24.04 gives a process no capabilities in a user namespace it creates unless an
      # AppArmor profile allows it, so Codex's bwrap sandbox cannot bring up its loopback
      # ("bwrap: loopback: Failed RTM_NEWADDR") and every tool command fails. This runner is
      # thrown away after the job. Docker Desktop needs no such change; an Ubuntu 24.04+
      # machine running the scenarios does (test/e2e/Makefile, `machines`). An image without
      # the restriction has nothing to lift.
      - name: Let sandboxes have capabilities in their user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the machine scenarios
        working-directory: test/e2e
        env:
          TERMA_E2E_UNCLASSIFIED: note
        # The agents' newest releases; the rows record the versions they turn out to be.
        run: make machines HOST_ARCH=amd64 CLAUDE_VERSION=latest CODEX_VERSION=latest MACHINE_PROFILES=
      - name: Upload this platform's compatibility rows
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-linux
          path: |
            test/e2e/report/linux/compat.json
            test/e2e/report/linux/notes.json
          if-no-files-found: ignore
          retention-days: 30
      # The files profile of each build, traced with strace (profile_files_test.go): the Harness
      # Reference's filesystem section for linux/amd64. The compat job's refgen takes it with
      # macOS's profiles.
      - name: Upload this platform's harness profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profiles-linux
          path: test/e2e/report/linux/profiles.json
          if-no-files-found: ignore
          retention-days: 90

  # The matrix, the field catalog and the Harness Reference: this night's rows from both
  # platforms, and the field census and profiles macOS takes, merged into the history, catalog
  # and reference (docs/harnesses), rendered as docs/COMPATIBILITY.md,
  # docs/compat/compat.json (the website's data) and docs/FIELDS.md, published as an artefact
  # and the run's summary. Both live on the compat-matrix branch, which each scheduled run
  # extends and pushes: that branch's docs/compat/compat.json is the published matrix.
  #
  # Before merging, the job says what the night changed against them (compatgen -digest): new
  # and removed fields per harness build, fields the relay withholds as unclassified,
  # capabilities whose result changed, and a census that did not run. It goes to the summary
  # and to Slack every night, "no changes" included, so a quiet channel means the job did not
  # run. Drift never fails the night.
  compat:
    needs: [e2e, machines]
    if: always()
    runs-on: ubuntu-latest
    environment: live-harnesses
    permissions:
      contents: write
    # The frequent new-build check (reference.yml) publishes the reference to the same
    # branch: never both at once.
    concurrency:
      group: compat-matrix
      cancel-in-progress: false
    steps:
      # Keeps its token: this job pushes to compat-matrix (publish.sh).
      - uses: actions/checkout@v7
      - name: Start from the published history and catalog
        run: test/e2e/compatgen/publish.sh restore
      - uses: actions/setup-go@v6
        with:
          go-version-file: test/e2e/go.mod
          cache-dependency-path: test/e2e/go.sum
      - uses: actions/download-artifact@v8
        with:
          pattern: "{compat,fields,profiles}-*"
          path: test/e2e/runs
      - name: Say what changed, and render the matrix and catalog
        working-directory: test/e2e
        run: |
          # No artifact at all leaves no runs/; the digest then says the census is missing.
          mkdir -p runs
          args=()
          for f in $(find runs -name compat.json | sort); do args+=(-run "$f"); done
          for f in $(find runs -name fields.json | sort); do args+=(-fields "$f"); done
          for f in $(find runs -name census.json | sort); do args+=(-census "$f"); done
          for f in $(find runs -name notes.json | sort); do args+=(-notes "$f"); done
          go run ./compatgen "${args[@]}" -digest report -source -link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat report/drift.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f ../../docs/COMPATIBILITY.md ]; then cat ../../docs/COMPATIBILITY.md >> "$GITHUB_STEP_SUMMARY"; fi
      # The Harness Reference: each build the night captured, normalized into its snapshot and
      # merged into the published ones, each harness's versions compared in order, changes
      # checked against the vendor's changelog (refgen; test/e2e/reference/SCHEMA.md). After
      # compatgen, so a build's support is tonight's history.
      - name: Render the Harness Reference
        working-directory: test/e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          for f in $(find runs -name profiles.json | sort); do args+=(-profiles "$f"); done
          for f in $(find runs -name fields.json | sort); do args+=(-fields "$f"); done
          for f in $(find runs -name census.json | sort); do args+=(-census "$f"); done
          # The catalog compatgen just merged gives each build a whole census saw its telemetry,
          # tonight's or an earlier night's: a backfill that took no census still has it.
          # Every step stays in timeline.json (-timeline-steps 1000) until the reader's pages
          # load the timeline-<n>.json archives; then the default pages it.
          go run ./refgen "${args[@]}" -catalog ../../docs/compat/fields.json -history ../../docs/compat/history.json -compat ../../docs/compat/compat.json -out ../../docs/harnesses -timeline-steps 1000 -fetch -source -announce "$RUNNER_TEMP/announcements.json"
          # The comparison of any two versions, run in the reader's browser: the same code that
          # made the diffs, built reproducibly, so an unchanged engine is no change on the branch.
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../../docs/harnesses/refdiff.wasm ./refdiff/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../../docs/harnesses/wasm_exec.js
      - name: Post the digest to Slack
        # A webhook that fails (revoked, Slack down) must not keep the night from being published.
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        working-directory: test/e2e
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::No SLACK_WEBHOOK_URL in the live-harnesses environment: the digest was not posted."
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' --data @report/slack.json "$SLACK_WEBHOOK_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: compatibility-matrix
          path: |
            docs/COMPATIBILITY.md
            docs/FIELDS.md
            docs/compat/
            docs/harnesses/
            test/e2e/report/drift.*
            test/e2e/report/slack.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Publish to the compat-matrix branch
        if: github.event_name == 'schedule'
        run: test/e2e/compatgen/publish.sh publish
      # Each version newer than any captured before, once, after it is published: never a
      # backfill, never twice. SLACK_RELEASES_WEBHOOK_URL picks a channel of its own; without
      # it, the digest's.
      - name: Announce new versions
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          news="$RUNNER_TEMP/announcements.json"
          [ -s "$news" ] || exit 0
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::No Slack webhook in the live-harnesses environment: $(jq length "$news") new versions not announced."
            exit 0
          fi
          jq -c '.[].slack' "$news" | while read -r message; do
            curl -fsS -X POST -H 'Content-Type: application/json' --data "$message" "$SLACK_WEBHOOK_URL"
          done
