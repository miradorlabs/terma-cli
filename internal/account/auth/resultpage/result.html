<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Terma CLI</title>
<style>
{{font-face}}
/* Colors: terma-frontend's src/styles/tokens.css, light (:root) and dark ([data-theme="dark"]). */
:root {
  --bg: #ffffff;
  --text: #131316;
  --success: #16a34a;
  --success-soft: #4ade8024;
  --error: #dc2626;
  --error-soft: #f871711f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0e12;
    --text: #ececf1;
    --success: #22c55e;
    --success-soft: #4ade8029;
    --error: #ef4444;
    --error-soft: #f8717129;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: "Outfit Variable", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 340px; padding: 32px 16px; }
.mark { align-self: center; }
h1 { margin: 0; text-align: center; font-size: 20px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; }
.note {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 10px;
  margin: 0;
  padding: 10px 12px;
  border: 1px solid;
  border-radius: 0.65rem;
  font-size: 14px;
  line-height: 1.625;
}
.note svg { margin-top: 3px; }
.success { background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 25%, transparent); }
.success svg { color: var(--success); }
.error { background: var(--error-soft); border-color: color-mix(in srgb, var(--error) 25%, transparent); }
.error svg { color: var(--error); }
.success .icon-error, .error .icon-success { display: none; }
</style>
<main>
  <svg class="mark" width="36" height="36" viewBox="0 0 24 24" fill="#8b6cff" aria-hidden="true">
    <rect x="2" y="2" width="9" height="9" rx="2.4"/>
    <rect x="13" y="2" width="9" height="9" rx="2.4" opacity=".35"/>
    <rect x="2" y="13" width="9" height="9" rx="2.4" opacity=".35"/>
    <rect x="13" y="13" width="9" height="9" rx="2.4"/>
  </svg>
  <h1>{{heading}}</h1>
  <p class="note {{tone}}" role="{{role}}">
    <svg class="icon-success" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>
    <svg class="icon-error" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>
    <span>{{detail}}</span>
  </p>
</main>
</html>
