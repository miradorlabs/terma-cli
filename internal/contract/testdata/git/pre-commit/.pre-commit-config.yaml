repos:
  - repo: local
    hooks:
      - id: terma-prepare-commit-msg
        name: terma prepare-commit-msg
        entry: sh -c 'command -v terma >/dev/null 2>&1 && { terma hook prepare-commit-msg "$@" || true; }; exit 0' --
        language: system
        stages:
          - prepare-commit-msg
        always_run: true
        pass_filenames: false
      - id: terma-post-commit
        name: terma post-commit
        entry: sh -c 'command -v terma >/dev/null 2>&1 && { terma hook post-commit "$@" || true; }; exit 0' --
        language: system
        stages:
          - post-commit
        always_run: true
        pass_filenames: false
default_install_hook_types:
  - pre-commit # added by terma install
  - prepare-commit-msg # added by terma install
  - post-commit # added by terma install
